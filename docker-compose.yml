services:
  db:
    image: postgres:16-alpine
    container_name: word-memo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-wordmemo}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-wordmemo}
      POSTGRES_DB: ${DATABASE_NAME:-wordmemo}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USER:-wordmemo} -d ${DATABASE_NAME:-wordmemo}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: word-memo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      DATABASE_HOST: db
    ports:
      - '${PORT:-3000}:3000'

volumes:
  postgres_data:
